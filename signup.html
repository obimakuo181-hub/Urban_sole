
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Urban Sole</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <main class="auth-container">
    <section class="auth-card">

      <a href="index.html" class="back-link">
        &larr; Back to Store
      </a>

      <div class="auth-header">
        <h1>URBAN SOLE</h1>
        <h2>Create Your Account</h2>
        <p>Join Urban Sole and step into your style.</p>
      </div>

      <form id="signup-form">

        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input
            type="text"
            id="signup-name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>
        <!-- Username -->
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input
              type="text"
              id="signup-username"
              name="username"
              placeholder="e.g. gabriel_obi24"
              minlength="3"
              maxlength="20"
              pattern="[a-z0-9_]{3,20}"
              title="Use 3–20 lowercase letters, numbers or underscores"
              autocomplete="username"
              required
            >
          </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input
            type="email"
            id="signup-email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>
                <!-- WhatsApp Number -->
        <div class="form-group">
          <label for="signup-whatsapp">WhatsApp Number</label>
          <input
            type="tel"
            id="signup-whatsapp"
            name="whatsapp"
            placeholder="08012345678"
            inputmode="numeric"
            autocomplete="tel"
            minlength="11"
            maxlength="11"
            pattern="[0-9]{11}"
            title="Enter exactly 11 digits, without letters or spaces"
            required
          >
        </div>

        <!-- Delivery Address -->
        <div class="form-group">
          <label for="signup-address">Delivery Address</label>
          <textarea
            id="signup-address"
            name="address"
            placeholder="Enter your full delivery address"
            rows="3"
            autocomplete="street-address"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">
            Confirm Password
          </label>
          <input
            type="password"
            id="signup-confirm-password"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <p id="signup-message" role="status" aria-live="polite"></p>

        <button type="submit" id="signup-btn">
          Create Account
        </button>

      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Log In</a>
      </p>

    </section>
  </main>

  <script type="module" src="signup.js"></script>

</body>
</html>
