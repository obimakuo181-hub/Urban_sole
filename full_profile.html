<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile | Urban Sole</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Complete Your Profile</h1>

      <p>
        Just one more step! Save your details so you
        won't need to enter them again during checkout.
      </p>

      <form id="profile-form">

        <div class="form-group">
          <label for="profile-name">Full Name</label>
          <input type="text" id="profile-name"
            placeholder="Enter your full name"
            maxlength="150" required>
        </div>

        <div class="form-group">
          <div class="form-group">
          <label for="profile-username">Username</label>
          <input
            type="text"
            id="profile-username"
            placeholder="Choose a username"
            minlength="3"
            maxlength="20"
            pattern="[a-z0-9_]{3,20}"
            title="Use 3–20 lowercase letters, numbers, or underscores"
            required
          >
        </div>
          <label for="profile-whatsapp">WhatsApp Number</label>
          <input type="tel" id="profile-whatsapp"
            placeholder="08012345678"
            inputmode="numeric"
            minlength="11" maxlength="11"
            pattern="[0-9]{11}" required>
        </div>

        <div class="form-group">
          <label for="profile-address">Delivery Address</label>
          <textarea id="profile-address"
            placeholder="Enter your full delivery address"
            rows="3" maxlength="1000" required></textarea>
        </div>

        <p id="profile-message" role="status"></p>

        <button type="submit" id="profile-btn">
          Save Profile
        </button>

      </form>
    </div>
  </main>

  <script type="module" src="full_profile.js"></script>
</body>
</html>
