<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us | Urban Sole</title>

  <link rel="stylesheet" href="/contact.css">
</head>

<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-container">

      <a href="/index.html" class="nav-logo">
        <img
          src="assets/5884026533653974931.jpg"
          alt="Urban Sole Logo"
          class="logo-img"
        >
        <span class="brand-name">Urban Sole</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#featured" class="nav-link">Shop</a>
        <a href="index.html#featured" class="nav-link">New Arrivals</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="/contact.html" class="nav-link active">Contact</a>
      </nav>

    </div>
  </header>


  <!-- Contact Section -->
  <main class="contact-page">

    <div class="contact-card">

      <!-- Image -->
      <div class="contact-image">

        <img
          src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?auto=format&fit=crop&w=900&q=80"
          alt="Urban Sole sneakers"
        >

      </div>


      <!-- Right side -->
      <div class="contact-content">

        <h1>Contact Us</h1>

        <div class="contact-layout">

          <!-- Form -->
          <form id="contact-form" class="contact-form">

            <div class="form-field">
              <label for="name">Full Name</label>

              <input
                type="text"
                id="name"
                name="name"
                required
              >
            </div>


            <div class="form-field">
              <label for="email">E-mail</label>

              <input
                type="email"
                id="email"
                name="email"
                required
              >
            </div>


            <div class="form-field">
              <label for="message">Message</label>

              <textarea
                id="message"
                name="message"
                required
              ></textarea>
            </div>


            <button type="submit" class="contact-btn">
              Contact Us
            </button>

            <p id="form-message" class="form-message"></p>

          </form>


          <!-- Contact information -->
          <div class="contact-info">

            <div class="info-block">
              <h3>Contact</h3>

              <p>
                support@urbansole.com
              </p>
            </div>


            <div class="info-block">
              <h3>Based in</h3>

              <p>
                Abuja,<br>
                Nigeria
              </p>
            </div>


            <!-- Social links -->
            <div class="social-links">

              <a href="#" aria-label="Facebook">
                f
              </a>

              <a href="#" aria-label="Instagram">
                ◎
              </a>

              <a href="#" aria-label="Twitter">
                𝕏
              </a>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>


  <!-- Footer -->
  <footer class="footer">

    <p>
      &copy; 2026 Urban Sole. All rights reserved.
    </p>

  </footer>


  <script src="/contact.js"></script>

</body>
</html>
