<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Sole Admin</title>
</head>

<body>

  <h1>Urban Sole Admin</h1>

  <section id="login-section">
    <h2>Admin Login</h2>

    <form id="login-form">
      <input
        type="email"
        id="admin-email"
        placeholder="Email address"
        required
      >

      <input
        type="password"
        id="admin-password"
        placeholder="Password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <p id="login-message"></p>
  </section>

<section id="admin-section" style="display: none;">

  <h2>Dashboard</h2>
  <p>Welcome to the Urban Sole inventory.</p>

  <button id="logout-btn">Log Out</button>

  <hr>

  <!-- Add Product -->
  <h2>Add New Product</h2>

  <form id="product-form">

    <input
      type="text"
      id="product-name"
      placeholder="Product name"
      required
    >

    <input
      type="text"
      id="product-brand"
      placeholder="Brand"
      required
    >

    <input
      type="text"
      id="product-category"
      placeholder="Category e.g. Sneakers"
      required
    >

    <input
      type="text"
      id="product-size"
      placeholder="Size e.g. 43"
      required
    >

    <input
      type="text"
      id="product-condition"
      placeholder="Condition e.g. Brand New"
      required
    >

    <input
      type="number"
      id="product-price"
      placeholder="Price e.g. 45000"
      required
    >

    <textarea
      id="product-description"
      placeholder="Product description"
    ></textarea>

    <input
      type="number"
      id="product-quantity"
      placeholder="Quantity"
      value="1"
      min="0"
      required
    >

    <select id="product-status">
      <option value="available">Available</option>
      <option value="sold">Sold</option>
      <option value="reserved">Reserved</option>
    </select>

    <button type="submit">Add Product</button>

  </form>

  <p id="product-message"></p>

  <hr>

  <!-- Inventory -->
  <h2>Inventory</h2>

  <div id="inventory-list">
    <p>Loading inventory...</p>
  </div>

</section>

</body>
</html>
